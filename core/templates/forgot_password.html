{% extends "base.html" %}
{% load static %}

{% block title %}Reset Password{% endblock %}

{% block body %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">🔑</div>
      <h1>Reset Password</h1>
      <p>Enter your short code to reset your password</p>
    </div>

    <form method="POST" action="{% url 'forgot_password' %}" autocomplete="off">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="short_code">Teacher Short Code</label>
        <input type="text" id="short_code" name="short_code" class="form-control" placeholder="e.g. ABC" required autofocus />
      </div>

      <div class="form-group">
        <label class="form-label" for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Letters + Numbers + Symbols" required />
        <p class="text-xs text-muted mt-1">Must include letters, numbers, and special characters</p>
      </div>

      <button type="submit" class="btn btn-accent btn-lg w-full mt-2">
        🔄 Reset Password
      </button>
    </form>

    <div class="divider"></div>

    <div class="text-center">
      <a href="{% url 'login' %}" class="text-sm text-secondary">
        ← Back to <span style="color: var(--primary-light);">Login</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}
